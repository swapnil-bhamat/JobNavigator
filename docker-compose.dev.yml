name: ${COMPOSE_PROJECT_NAME:-jobnavigator-dev}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev_password}
      POSTGRES_DB: jobnavigator
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://jobnavigator:${POSTGRES_PASSWORD:-change_me_local_dev_password}@db:5432/jobnavigator
      JN_RUNNER_MANAGEMENT: "0"
      JN_ENABLE_GMAIL: ${JN_ENABLE_GMAIL:-0}
      JN_ENABLE_UNOFFICIAL_LINKEDIN: ${JN_ENABLE_UNOFFICIAL_LINKEDIN:-0}
      JN_TELEMETRY: ${JN_TELEMETRY:-off}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backups:/app/backups
      - career_data_dev:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata_dev:
  career_data_dev:
